 { q: "What WHT rate applies to royalty paid to a resident individual recipient?", o: ["10%","15%","5%","2%"], a: 2, e: "Royalty attracts 10% for a company recipient and 5% for an individual recipient. WHT on royalty is final for non-residents." },
 { q: "Which statement about WHT on rent is correct?", o: ["It is a final tax for individuals","It is not deducted from rent","It is 2% for companies","It is 10% and an advance payment creditable against the landlord’s tax"], a: 3, e: "WHT on rent is 10% and is a credit, not final tax. Residential rent is also VAT-exempt." }
]},
{ id: 20, name: "Companies income tax", sub: "Rates, ETR, deductions", qs: [
 { q: "On what profits is a Nigerian company taxed?", o: ["Worldwide profits","Nigerian profits only","Profits remitted to Nigeria only","Export profits only"], a: 0, e: "A Nigerian company is taxed on worldwide profits under s.6 NTA. A non-resident company is taxed on Nigerian-source profit." },
 { q: "Which company is a small company exempt from CIT?", o: ["Turnover ₦90m, fixed assets ₦300m, a distributor","Turnover ₦60m, fixed assets ₦100m, a law firm","Turnover ₦95m, fixed assets ₦180m, a manufacturer","Turnover ₦120m, fixed assets ₦100m, a trader"], a: 2, e: "A small company has turnover of ₦100m or less and fixed assets of ₦250m or less, and is not a professional services business." },
 { q: "What is the CIT rate for a company that is not small?", o: ["20%","25%","30%","15%"], a: 2, e: "Companies other than small companies pay 30% (s.56), which may be reduced by Order." },
 { q: "The effective tax rate (ETR) top-up applies when covered taxes divided by net income are below:", o: ["10%","15%","20%","30%"], a: 1, e: "A top-up tax brings the ETR up to 15% for large groups and for companies with turnover of ₦50bn or more." },
 { q: "Net income is ₦10,000m and covered taxes are ₦720m. What is the top-up tax at 15% (simple method)?", o: ["₦720m","₦1,500m","₦780m","₦0"], a: 2, e: "Required tax = 15% × ₦10,000m = ₦1,500m. Top-up = ₦1,500m − ₦720m = ₦780m." },
 { q: "Profit before tax is ₦40m. Donations of ₦2m to a registered charity are included. Is the donation fully allowable?", o: ["No, donations are never allowable","Only if paid in cash","Yes, up to 10% of profit before tax (₦4m)","Yes, up to 50% of profit"], a: 2, e: "Donations to approved recipients are deductible up to 10% of profit before tax. ₦2m is below the ₦4m ceiling, so it is allowed." },
 { q: "Which item must always be added back in computing assessable profit?", o: ["Salaries and wages","Rent","Depreciation and unrealised exchange losses","Repairs"], a: 2, e: "Depreciation, impairment and unrealised exchange differences are not allowable. Capital allowances replace depreciation." },
 { q: "Profit before tax ₦40m; add back depreciation ₦6m, political donation ₦1m, unrealised loss ₦0.8m and fine ₦0.2m; deduct unrealised gain ₦0.5m and franked dividend ₦2m. What is the assessable profit?", o: ["₦45.5m","₦48.0m","₦43.5m","₦40.0m"], a: 0, e: "₦40m + ₦8m − ₦2.5m = ₦45.5m." },
 { q: "A company’s first accounts cover 16 months (1 Sept 2025 to 31 Dec 2026) with profit of ₦8,000,000. What is assessed for the 2026 year of assessment?", o: ["₦8,000,000","₦2,000,000 (4/16)","₦6,000,000","₦4,000,000"], a: 1, e: "The first year runs from commencement to the end of the first accounting period, time-apportioned: 4 months in 2025 are 4/16 × ₦8,000,000 = ₦2,000,000, and the other 12 months give ₦6,000,000 for 2027." },

const L = ["A","B","C","D"];
const $ = (s) => document.querySelector(s);
const scores = {}; // chapter id -> best score
let cur = null; // {chIdx, items, i, answers[], done}

function shuffle(a){ const r=a.slice(); for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; } return r; }
function prep(ch){ return ch.qs.map((x,k)=>{ const idx=shuffle([0,1,2,3]); return { q:x.q, o:idx.map(n=>x.o[n]), a:idx.indexOf(x.a), e:x.e, n:k+1 }; }); }

function renderNav(){
  const ul = $("#chlist"); ul.innerHTML = "";
  CH.forEach((c,i)=>{
    const li = document.createElement("li");
    const b = document.createElement("button");
    b.className = "chbtn"; b.type = "button";
    if (cur && cur.chIdx === i) b.setAttribute("aria-current","true");
    const sc = scores[c.id];
    b.innerHTML = `<span class="nm">Chapter ${c.id}: ${c.name}<small>${c.sub}</small></span><span class="sc ${sc!=null?"done":""}">${sc!=null? sc+"/10":"–"}</span>`;
    b.addEventListener("click",()=>start(i));
    li.appendChild(b); ul.appendChild(li);
  });
}

function start(chIdx){
  cur = { chIdx, items: prep(CH[chIdx]), i: 0, answers: [], done: false, picked: null };
  renderNav(); render();
  if (window.matchMedia("(max-width:820px)").matches) {
    const list = $("#chlist");
    const selected = list.children[chIdx];
    const behavior = window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth";
    if (selected) selected.scrollIntoView({block: "nearest", inline: "center", behavior});
    window.scrollTo({top: $("#main").offsetTop - 10, behavior});
  }
}

function ticks(){
  return `<ul class="ticks" aria-hidden="true">` + cur.items.map((_,k)=>{
    const a = cur.answers[k]; let c = "";
    if (a !== undefined) c = a.ok ? "ok" : "no"; else if (k === cur.i) c = "cur";
    return `<li class="${c}"></li>`; }).join("") + `</ul>`;
}

function render(){
  const main = $("#main");
  if (!cur){ main.innerHTML = `<div class="sheet"><p class="q">Choose a chapter on the left to begin.</p><p class="empty">Chapters 1 to 27 are here. More chapters will be added as we go.</p></div>`; return; }
  const ch = CH[cur.chIdx];
  if (cur.done){ renderResult(ch); return; }
  const it = cur.items[cur.i]; const ans = cur.answers[cur.i];
  let html = `<div class="sheet"><div class="meta"><span>Chapter ${ch.id}: ${ch.name}</span><span>Question ${cur.i+1} of 10</span></div>${ticks()}<p class="q">${it.q}</p><ul class="opts">`;
  it.o.forEach((t,k)=>{
    let cls = "opt", dis = "";
    if (ans){ dis = "disabled"; if (k === it.a) cls += " right"; else if (k === ans.pick) cls += " wrong"; else cls += " dim"; }
    html += `<li><button type="button" class="${cls}" data-k="${k}" ${dis}><span class="lt">${L[k]}</span><span>${t}</span></button></li>`;
  });
  html += `</ul>`;
  if (ans){
    html += `<div class="fb ${ans.ok?"ok":"no"}" role="status"><strong>${ans.ok?"Correct":"Not quite. The answer is "+L[it.a]}</strong><p>${it.e}</p></div>
    <div class="actions"><button type="button" class="btn" id="next">${cur.i===9?"See my score":"Next question"}</button><span class="hintkey">Press Enter to continue</span></div>`;
  } else {
    html += `<div class="actions"><span class="hintkey">Tap an answer, or press A, B, C or D</span></div>`;
  }
  html += `</div>`;
  main.innerHTML = html;
  main.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>pick(+b.dataset.k)));
  const nx = $("#next"); if (nx){ nx.addEventListener("click",advance); nx.focus({preventScroll:true}); }
}

function pick(k){
  if (cur.answers[cur.i]) return;
  const it = cur.items[cur.i];
  cur.answers[cur.i] = { pick:k, ok: k === it.a };
  render();
}
function advance(){
  if (cur.i < 9){ cur.i++; render(); window.scrollTo({top: $("#main").offsetTop - 10}); }
  else { cur.done = true; const s = cur.answers.filter(a=>a.ok).length; const id = CH[cur.chIdx].id; if (scores[id]==null || s>scores[id]) scores[id]=s; renderNav(); render(); }
}

function renderResult(ch){
  const s = cur.answers.filter(a=>a.ok).length;
  const msg = s===10 ? "Full marks." : s>=8 ? "Strong. Review the ones you missed." : s>=6 ? "Getting there. Re-read the chapter notes on the missed points." : "Go back to the chapter notes, then try again.";
  const missed = cur.items.map((it,k)=>({it,a:cur.answers[k]})).filter(x=>!x.a.ok);
  let html = `<div class="sheet"><div class="meta"><span>Chapter ${ch.id}: ${ch.name}</span><span>Finished</span></div>${ticks()}
  <div class="total"><span class="fig">${s}</span><span class="of">out of 10. ${msg}</span></div>`;
  if (missed.length){
    html += `<ul class="review">` + missed.map(x=>`<li><div class="rq">${x.it.n}. ${x.it.q}</div><div class="ya">Your answer: ${x.it.o[x.a.pick]}</div><div class="ra">Correct answer: ${x.it.o[x.it.a]}</div><div>${x.it.e}</div></li>`).join("") + `</ul>`;
  } else { html += `<p class="empty">No questions missed.</p>`; }
  html += `<div class="actions"><button type="button" class="btn" id="again">Try this chapter again</button>`;
  if (cur.chIdx < CH.length-1) html += `<button type="button" class="btn alt" id="nextch">Go to Chapter ${CH[cur.chIdx+1].id}</button>`;
  html += `</div></div>`;
  $("#main").innerHTML = html;
  $("#again").addEventListener("click",()=>start(cur.chIdx));
  const nc = $("#nextch"); if (nc) nc.addEventListener("click",()=>start(cur.chIdx+1));
}

document.addEventListener("keydown",(e)=>{
  if (!cur || cur.done || e.metaKey || e.ctrlKey || e.altKey) return;
  const k = "abcd".indexOf(e.key.toLowerCase());
  if (k > -1 && e.key.length === 1 && !cur.answers[cur.i]) { pick(k); }
  else if (e.key === "Enter" && cur.answers[cur.i] && document.activeElement && document.activeElement.id !== "next") { advance(); }
});

renderNav(); render();
</script>
</body>
</html>
