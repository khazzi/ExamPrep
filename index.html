<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ICAN Taxation 2026 – Chapter quizzes</title>
<meta name="description" content="Practice ICAN Taxation 2026 with chapter-by-chapter quizzes, instant explanations and scores.">
<meta name="theme-color" content="#f2f6f1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%92%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600&family=Public+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#f2f6f1; --sheet:#fbfdfa; --ink:#1a2b3c; --muted:#5a6b78; --rule:#c9d6cf; --rule-strong:#97aaa0;
  --margin:#c4544a; --good:#1d6b50; --good-bg:#dff0e7; --bad:#a93a32; --bad-bg:#f8e1de; --accent:#2f5d8a; --focus:#2f5d8a;
  --serif:"Newsreader","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:"Public Sans","Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#10181d; --sheet:#172128; --ink:#e4ebee; --muted:#9aabb5; --rule:#2c3b44; --rule-strong:#476069;
    --margin:#d46a60; --good:#6fd0a6; --good-bg:#163529; --bad:#f08f86; --bad-bg:#3a1d1b; --accent:#8db6e0; --focus:#8db6e0; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#10181d; --sheet:#172128; --ink:#e4ebee; --muted:#9aabb5; --rule:#2c3b44; --rule-strong:#476069;
  --margin:#d46a60; --good:#6fd0a6; --good-bg:#163529; --bad:#f08f86; --bad-bg:#3a1d1b; --accent:#8db6e0; --focus:#8db6e0; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--paper);z-index:10}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

.shell{max-width:1040px;margin:0 auto;padding:28px 20px 56px;display:grid;grid-template-columns:260px minmax(0,1fr);gap:36px}
header.top{grid-column:1/-1;margin-bottom:4px}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(1.7rem,4vw,2.3rem);line-height:1.15;margin:0 0 6px;letter-spacing:-.01em}
.lede{margin:0;color:var(--muted);max-width:60ch}

nav.chapters{align-self:start;min-width:0}
nav.chapters h2{font-size:.95rem;font-weight:600;margin:0 0 10px;color:var(--muted)}
.chlist{list-style:none;margin:0;padding:0;border-top:2px solid var(--rule-strong)}
.chbtn{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:baseline;width:100%;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--rule);padding:12px 8px;cursor:pointer}
.chbtn:hover{background:color-mix(in srgb,var(--accent) 7%,transparent)}
.chbtn[aria-current="true"]{background:var(--sheet);box-shadow:inset 4px 0 0 var(--margin)}
.chbtn .nm{font-weight:500}
.chbtn .nm small{display:block;color:var(--muted);font-weight:400;font-size:.82rem}
.chbtn .sc{font-variant-numeric:tabular-nums;font-weight:600;color:var(--muted)}
.chbtn .sc.done{color:var(--good)}

main{min-width:0}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-left:3px solid var(--margin);border-radius:3px;padding:26px 28px 24px;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,color-mix(in srgb,var(--rule) 55%,transparent) 31px,color-mix(in srgb,var(--rule) 55%,transparent) 32px)}
.meta{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-bottom:12px;color:var(--muted);font-size:.9rem}
.ticks{display:flex;gap:5px;margin:0 0 18px;padding:0;list-style:none}
.ticks li{flex:1;height:8px;border-bottom:2px solid var(--rule-strong)}
.ticks li.ok{border-color:var(--good);background:var(--good-bg)}
.ticks li.no{border-color:var(--bad);background:var(--bad-bg)}
.ticks li.cur{border-color:var(--accent)}
.q{font-family:var(--serif);font-size:clamp(1.2rem,2.6vw,1.45rem);line-height:1.4;margin:0 0 18px;max-width:62ch}
.opts{display:grid;gap:9px;margin:0;padding:0;list-style:none}
.opt{display:grid;grid-template-columns:2rem 1fr;gap:10px;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--rule-strong);background:var(--sheet);border-radius:3px;cursor:pointer;transition:border-color .12s,background .12s}
.opt:hover:not([disabled]){border-color:var(--accent);background:color-mix(in srgb,var(--accent) 6%,var(--sheet))}
.opt .lt{font-weight:600;color:var(--muted)}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.right .lt{color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .lt{color:var(--bad)}
.opt.dim{opacity:.62}
.fb{margin-top:18px;padding:14px 16px;border-left:4px solid var(--rule-strong);background:color-mix(in srgb,var(--paper) 70%,var(--sheet))}
.fb.ok{border-color:var(--good)} .fb.no{border-color:var(--bad)}
.fb strong{display:block;margin-bottom:4px}
.fb.ok strong{color:var(--good)} .fb.no strong{color:var(--bad)}
.fb p{margin:0}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px;align-items:center}
.btn{padding:10px 18px;border-radius:3px;border:1px solid var(--ink);background:var(--ink);color:var(--sheet);font-weight:600;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border-color:var(--rule-strong)}
.btn:hover{filter:brightness(1.12)}
.hintkey{color:var(--muted);font-size:.85rem}

.total{display:flex;align-items:baseline;gap:14px;margin:6px 0 4px}
.total .fig{font-family:var(--serif);font-size:3.2rem;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;border-bottom:4px double var(--ink);padding-bottom:4px}
.total .of{color:var(--muted)}
.review{margin:22px 0 0;padding:0;list-style:none;border-top:2px solid var(--rule-strong)}
.review li{padding:12px 4px;border-bottom:1px solid var(--rule)}
.review .rq{font-weight:600;margin-bottom:4px}
.review .ra{color:var(--good)} .review .ya{color:var(--bad)}
.empty{color:var(--muted)}

@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr);gap:20px;padding:20px 14px 44px}
  .chlist{display:flex;overflow-x:auto;border-top:0;border-bottom:2px solid var(--rule-strong);gap:0;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;overscroll-behavior-x:contain}
  .chlist li{scroll-snap-align:center}
  .chbtn{width:auto;min-width:150px;min-height:44px;border-bottom:0;border-right:1px solid var(--rule);grid-template-columns:1fr;gap:2px}
  .chbtn[aria-current="true"]{box-shadow:inset 0 -4px 0 var(--margin)}
  .sheet{padding:20px 16px;overflow-wrap:anywhere}
  .meta{flex-wrap:wrap;align-items:flex-start}
  .actions .btn{min-height:44px}
}
@media (max-width:480px){
  .shell{gap:16px;padding:18px 12px 32px}
  .chbtn{min-width:138px;padding:10px 8px}
  .sheet{padding:18px 14px}
  .opt{grid-template-columns:1.75rem minmax(0,1fr);gap:8px;padding:12px 10px;min-height:48px}
  .actions{align-items:stretch}
  .actions .btn{flex:1 1 100%}
  .actions .hintkey{width:100%}
  .total{align-items:flex-start;gap:10px}
  .total .fig{font-size:2.8rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <h1>ICAN Taxation 2026: chapter quizzes</h1>
    <p class="lede">Pick a chapter and answer ten questions. Each answer is marked straight away with the reason, and your score is kept for the chapter.</p>
  </header>
  <nav class="chapters" aria-label="Chapters">
    <h2>Chapters</h2>
    <ul class="chlist" id="chlist"></ul>
  </nav>
  <main id="main" aria-live="polite"></main>
</div>

<script>
const CH = [
{ id: 1, name: "Introduction to taxation", sub: "Concepts, canons, avoidance", qs: [
 { q: "Which description best defines a tax?", o: ["A voluntary contribution made in exchange for a specific government service","A compulsory, non-penal and unrequited payment to government","A fine imposed on a person who breaks the law","A charge collected only for a specific purpose or agency"], a: 1, e: "A tax is compulsory, not a penalty, and unrequited: the payer gets no direct, specific benefit in return. Option D describes a levy." },
 { q: "How does a levy differ from a tax?", o: ["A levy is voluntary, while a tax is compulsory","A levy is paid only by companies, while a tax is paid only by individuals","A levy is paid only to local governments","A levy is charged for a specific purpose or service, while a tax funds general government spending"], a: 3, e: "Both are compulsory. A levy is earmarked for a specific purpose or group (for example the development levy), whereas a tax raises general revenue." },
 { q: "Which of the following is an indirect tax?", o: ["Personal income tax","Companies income tax","Value added tax","Development levy on assessable profit"], a: 2, e: "VAT is charged on a supply but its burden is passed on to the final consumer, so it is indirect." },
 { q: "A tax system in which the rate rises as the taxpayer’s income rises is called:", o: ["Regressive","Progressive","Proportional","Neutral"], a: 1, e: "The PIT bands (0%, 15%, 18%, 21%, 23%, 25%) are progressive. A flat rate such as 7.5% VAT is proportional." },
 { q: "A trader adds VAT to his selling price so that customers bear it. This is an example of tax:", o: ["Shifting","Yield","Base","Effect"], a: 0, e: "Tax shifting is passing the burden from the person on whom the tax first falls (impact) to another person." },
 { q: "Tax yield is best described as:", o: ["The percentage applied to the tax base","The thing that is taxed","The person who finally bears the tax","The revenue actually collected from a tax"], a: 3, e: "Yield is the revenue actually collected, which depends on the base, the rate and compliance." },
 { q: "Which canon of taxation requires that the amount, time and manner of payment be clear to the taxpayer?", o: ["Equity","Economy","Convenience","Certainty"], a: 3, e: "Certainty means the taxpayer knows what to pay, when and how." },
 { q: "Deduction of PAYE from an employee’s monthly pay best illustrates which canon?", o: ["Convenience","Equity","Flexibility","Neutrality"], a: 0, e: "PAYE collects tax at the time and in the manner most convenient to the taxpayer." },
 { q: "Which statement correctly distinguishes tax avoidance from tax evasion?", o: ["Avoidance is illegal concealment; evasion is lawful planning","Both are lawful ways of reducing tax","Avoidance uses the law’s gaps and is legal, though it may be challenged; evasion is illegal concealment or false statement","Both are criminal offences with the same penalties"], a: 2, e: "Avoidance works within the letter of the law (and can be attacked under s.47 NTAA). Evasion breaks the law." },
 { q: "Which 2025 enabling Act sets out the rules on registration, returns, assessment, collection, objections and penalties?", o: ["Nigeria Tax Administration Act (NTAA) 2025","Nigeria Tax Act (NTA) 2025","Customs Service Act 2023","Petroleum Industry Act 2021"], a: 0, e: "The NTAA 2025 is the administration law. The NTA 2025 is the substantive charging law." }
]},
{ id: 2, name: "Tax administration", sub: "JRB, NRS, State IRS, Tribunal", qs: [
 { q: "Who is the Chairman of the Joint Revenue Board?", o: ["The Minister of Finance","The Executive Chairman of the NRS","The Governor of the CBN","The Attorney-General of the Federation"], a: 1, e: "The JRB is chaired by the Executive Chairman of the NRS." },
 { q: "What is the quorum for a meeting of the Joint Revenue Board?", o: ["A simple majority of all members","Two-thirds of the State chairmen","One-third of members, including the Chairman","All ex-officio members"], a: 2, e: "The quorum is one-third of members, which must include the Chairman." },
 { q: "Which of the following is a function of the Joint Revenue Board?", o: ["Resolving disputes between tax authorities, including residency disputes","Raising additional assessments on companies","Hearing taxpayers’ appeals against assessments","Collecting VAT on imported goods"], a: 0, e: "The JRB resolves disputes between tax authorities, including residency disputes, and maintains the integrated Tax ID database." },
 { q: "Which taxpayer falls within the exclusive jurisdiction of the NRS?", o: ["A resident individual employed in Lagos State","A trader paying a local market levy","A resident individual living in Kano State","A limited liability company"], a: 3, e: "The NRS covers companies, armed forces and police personnel, external affairs staff and non-resident individuals." },
 { q: "A State Internal Revenue Service is responsible mainly for taxing:", o: ["Companies incorporated in the State","Non-resident individuals","Resident individuals, estates, trusts and settlements","Members of the armed forces"], a: 2, e: "The State IRS taxes individuals, estates, trusts and settlements within the State." },
 { q: "What is the quorum of a Tax Appeal Tribunal sitting with five Commissioners?", o: ["Two","Three","Four","All five"], a: 1, e: "A Tribunal zone has five Commissioners and a quorum of three." },
 { q: "What is the term of office of a Tax Appeal Commissioner?", o: ["Three years, renewable once","Four years, renewable once","Five years, not renewable","Two years, renewable twice"], a: 0, e: "Commissioners serve three years, renewable once. The NRS Board’s non-ex-officio members serve four years, renewable once." },
 { q: "Under s.47 NTAA, what may the authority do with an arrangement that lacks commercial substance and exists mainly to gain a tax benefit?", o: ["Treat the arrangement as a criminal offence automatically","Refund the tax benefit to the taxpayer","Accept it, provided it is disclosed within 30 days","Disregard or recharacterise it and adjust the tax position"], a: 3, e: "Section 47 is Nigeria’s general anti-avoidance rule: such an arrangement may be disregarded or recharacterised." },
 { q: "While a taxpayer’s objection or appeal is pending, s.86 NTAA requires that:", o: ["All tax payment stops until the case is decided","Only returns must be filed; payment is suspended","Returns must still be filed and undisputed tax paid","The taxpayer is deregistered until judgment"], a: 2, e: "Filing an objection or appeal does not suspend obligations. Only the disputed portion may be held in abeyance." },
 { q: "Which of the following is collectible by a local government?", o: ["Companies income tax","Property tax","Value added tax","Market levies and daily ticketing"], a: 3, e: "Local governments collect market levies, daily ticketing, user charges and similar rates. Property tax is a State tax." }
]},
{ id: 3, name: "Fiscal policy and administration", sub: "Policy, law, administration", qs: [
 { q: "Fiscal policy is best described as:", o: ["The central bank’s control of interest rates and the money supply","Government’s use of taxation and spending to achieve economic and social goals","The rules for registering and assessing taxpayers","The process of enacting tax statutes in the National Assembly"], a: 1, e: "Fiscal policy is government’s use of taxation and spending to influence growth, stability and equity. It sets the goals." },
 { q: "Which of the following is an instrument of fiscal policy rather than monetary policy?", o: ["Changing the monetary policy rate","Varying the banks’ cash reserve ratio","Open market operations in government securities","Raising or lowering tax rates and government spending"], a: 3, e: "Tax rates and government spending are fiscal tools. Interest rates, the cash reserve ratio and open market operations are monetary tools." },
 { q: "An expansionary fiscal policy would typically involve:", o: ["Reducing tax rates and increasing government spending to raise demand","Increasing tax rates and cutting government spending to reduce demand","Raising the central bank’s policy rate","Selling government securities to withdraw cash from banks"], a: 0, e: "Expansionary policy cuts taxes and/or raises spending to lift demand, output and employment." },
 { q: "Government wants to reduce inflationary pressure using fiscal policy. Which approach fits?", o: ["Lower taxes and higher government spending","Lower taxes and unchanged spending","Higher taxes and reduced government spending","Higher spending funded by borrowing"], a: 2, e: "Contractionary policy raises taxes and/or cuts spending to cool demand." },
 { q: "What is the main role of tax legislation in the policy, law and administration relationship?", o: ["To set the economic goals government wants to achieve","To turn policy into binding rules with legal force and certainty","To collect the revenue and enforce compliance","To advise the President on monetary targets"], a: 1, e: "Legislation converts policy into binding law with legal force and certainty." },
 { q: "Which of the following is the main role of tax administration?", o: ["Defining the tax base and the tax rates","Setting the nation’s growth and employment goals","Deciding which sectors deserve incentives","Implementing the law through registration, assessment, collection and enforcement"], a: 3, e: "Administration turns the law into actual revenue (yield)." },
 { q: "A clear, well-drafted tax law is paired with weak registration, few audits and slack enforcement. The most likely result is:", o: ["Low tax yield because of non-compliance and leakage","High yield, because clear law guarantees compliance","A higher tax rate automatically","No effect, since legislation alone determines yield"], a: 0, e: "A clear law fails if administration is weak, so yield stays low." },
 { q: "A tax authority is efficient, but the tax law is unclear and contradictory. The likely result is:", o: ["Perfect compliance, because administration is efficient","Lower compliance costs for taxpayers","More disputes, uncertainty and higher compliance cost","The policy goals are met automatically"], a: 2, e: "Unclear law produces differing interpretations, disputes and higher compliance cost." },
 { q: "Poor coordination of tax policy and administration across the three tiers of government most directly leads to:", o: ["Convergence of tax rates across all tiers","Multiplicity of overlapping taxes and levies","Lower costs of collection","Greater certainty for investors"], a: 1, e: "Uncoordinated tiers produce overlapping levies, investor uncertainty and high compliance cost for little yield." },
 { q: "Which statement best captures the ideal relationship between fiscal policy, legislation and administration?", o: ["Administration should only follow orders and not report back","Policy is fixed and never changes once a law is passed","Legislation alone should determine reform","Administration’s data on compliance and yield should inform new policy and legislation"], a: 3, e: "The relationship is a loop: administration’s data should feed back into policy and legislative reform." }
]},
{ id: 4, name: "National Tax Policy 2017", sub: "Objectives, tools, stakeholders", qs: [
 { q: "Which of the following is an objective of the Revised National Tax Policy (NTP) 2017?", o: ["To maximise tax rates on companies to replace oil revenue quickly","To provide a clear, stable and predictable tax framework and raise sustainable revenue","To abolish all tax incentives","To transfer all taxing powers to the federal government"], a: 1, e: "The NTP aims at a clear, stable and predictable framework, sustainable revenue and better compliance." },
 { q: "Why does the NTP recommend a ‘focus on indirect taxation’?", o: ["To make income taxes the main source of revenue","To reduce the number of VAT-registered businesses","To build stable, broad-based revenue from consumption taxes such as VAT","To replace customs duties with the development levy"], a: 2, e: "Consumption taxes are broad-based and give stable revenue." },
 { q: "In the NTP, ‘convergence of tax rates’ means:", o: ["Narrowing differences in rates and treatment among tax regimes and tiers to reduce distortion","Applying a single flat rate to all taxes","Increasing all rates at the same time","Allowing each State to set its own rates without coordination"], a: 0, e: "Convergence narrows differences among regimes and tiers. It does not mean one rate for everything." },
 { q: "Which statement best reflects the NTP’s position on special arrangements and incentives?", o: ["They should be granted to all businesses indefinitely","They should be abolished entirely","They should be granted only at the discretion of each Governor","They should be granted only where justified, be time-bound and be evaluated"], a: 3, e: "Incentives should be justified, time-bound and reviewed for value for money." },
 { q: "‘Taxation and diversification’ under the NTP refers to:", o: ["Taxing the oil sector at the highest possible rate","Using tax support to grow non-oil sectors and reduce dependence on oil revenue","Diversifying the number of taxes a company pays","Moving all tax collection to the States"], a: 1, e: "Tax support is used to grow non-oil sectors such as agriculture, manufacturing and technology." },
 { q: "Which of the following is a responsibility of the taxpayer under the NTP?", o: ["Enacting and amending tax laws","Educating the public through the media","Registering, keeping records, filing correct returns and paying on time","Prosecuting offenders in court"], a: 2, e: "The taxpayer registers, keeps records, files correct returns and pays on time." },
 { q: "What is the role of professional bodies, tax practitioners, consultants and agents under the NTP?", o: ["Giving competent, ethical advice and supporting compliance","Setting the national tax rates","Printing tax stamps","Collecting tax on behalf of the NRS without accreditation"], a: 0, e: "They give competent, ethical advice, support compliance and contribute to policy." },
 { q: "‘Technology and tax intelligence’ as a mandate of the three tiers of government involves:", o: ["Relying on manual registers to protect confidentiality","Collecting taxes in cash only","Auditing every taxpayer every year","Using e-systems, shared data and risk-based audits to find non-compliance"], a: 3, e: "The tiers should use e-systems, share data across agencies and run risk-based audits." },
 { q: "Which of the following is the implementation role of the Legislature under the NTP?", o: ["Deducting and remitting WHT and VAT as a payer","Enacting and updating tax laws, approving policy changes and overseeing agencies","Assessing and collecting tax from taxpayers","Coordinating fiscal policy and publishing tax-expenditure data"], a: 1, e: "The legislature enacts and updates tax laws, approves policy changes and oversees the agencies." },
 { q: "Which mechanisms form part of the NTP’s approach to dispute resolution?", o: ["Only court litigation up to the Supreme Court","Only objection to the same tax authority","Objection, advance rulings, the Tax Appeal Tribunal, the Tax Ombud and ADR","Referring all disputes to the President"], a: 2, e: "Mechanisms include objection, advance rulings, the Tribunal, the Tax Ombud and alternative dispute resolution." }
]},
{ id: 5, name: "Ethics in taxation", sub: "Principles, confidentiality, conflicts", qs: [
 { q: "Which list correctly states the five fundamental principles of ethics for professional accountants (IESBA Code)?", o: ["Integrity, independence, competence, confidentiality, professionalism","Honesty, objectivity, profit, confidentiality, courtesy","Integrity, objectivity, professional competence and due care, confidentiality, professional behaviour","Fairness, transparency, accountability, competence, loyalty"], a: 2, e: "Independence is an audit requirement, not one of the five fundamental principles." },
 { q: "A tax practitioner refuses to sign a return that he knows contains a materially false statement. Which principle is he upholding?", o: ["Integrity","Confidentiality","Objectivity","Professional competence and due care"], a: 0, e: "Integrity requires honesty and not being associated with information believed to be false or misleading." },
 { q: "A practitioner is pressured by a long-standing client’s director to take an aggressive tax position. The principle most directly at risk is:", o: ["Confidentiality","Professional behaviour","Professional competence and due care","Objectivity"], a: 3, e: "Objectivity means not letting bias, conflict of interest or undue influence override judgement." },
 { q: "What does the principle of professional competence and due care require of a tax practitioner?", o: ["To keep client information private at all times","To maintain up-to-date knowledge and skill and act diligently under current law and standards","To avoid any conduct that discredits the profession","To avoid bias and conflicts of interest"], a: 1, e: "Tax law changes often, so the practitioner must keep skills current and act diligently." },
 { q: "In which situation may a tax practitioner disclose a client’s confidential information?", o: ["When a friend asks for it to help with his own tax matters","When disclosure would advantage the practitioner commercially","When required by a court order","Whenever the practitioner believes it is harmless"], a: 2, e: "Disclosure is allowed where permitted by law and authorised by the client, required by law, or there is a professional duty or right." },
 { q: "Which statement about the principle of confidentiality is correct?", o: ["It continues after the engagement ends and also bars using the information for personal advantage","It ends when the engagement ends","It bars disclosure but allows personal use of the information","It applies only to written information"], a: 0, e: "Confidentiality continues after the engagement and forbids both disclosure and personal use." },
 { q: "A tax practitioner discovers that two of his clients have directly competing interests. What should he do?", o: ["Continue to act for both and say nothing","Drop the smaller client immediately without telling anyone","Let the clients resolve it between themselves","Identify and disclose the conflict, obtain consent, apply safeguards, and withdraw if it cannot be managed"], a: 3, e: "Identify, evaluate, disclose with informed consent, apply safeguards, and withdraw if it cannot be managed." },
 { q: "A tax adviser sets his fee as a percentage of the tax he saves the client. The main threat this creates is a:", o: ["Intimidation threat","Self-interest threat","Self-review threat","Familiarity threat"], a: 1, e: "Fees tied to the amount of tax saved create a self-interest threat to objectivity." },
 { q: "While preparing this year’s return, a practitioner finds a material error in the client’s prior-year return made by another firm. What should he do?", o: ["Ignore it, because the previous firm made the error","Quietly report the client to the tax authority without telling him","Tell the client, advise correction, and not sign a return he knows is misstated if the client refuses","Wait until the authority queries the return"], a: 2, e: "Leaving a known, material error uncorrected is itself an ethical problem. Advise correction and do not sign a known misstatement." },
 { q: "Which sanctions can a professional body impose for breach of ethical rules?", o: ["Reprimand, fine, suspension or expulsion, and withdrawal of the practising licence","Only a written warning","Automatic imprisonment","No sanction, since the Code is advisory"], a: 0, e: "Sanctions range from reprimand and fine to suspension, expulsion and withdrawal of the licence." }
]},
{ id: 6, name: "Returns and assessments", sub: "Deadlines, penalties, assessments", qs: [
 { q: "When a tax authority refuses an application for a Tax ID, within what time must it notify the applicant?", o: ["Within 30 days","Within five working days","Within six months","There is no deadline for notifying a refusal"], a: 1, e: "The authority must notify a refusal within five working days (s.7 NTAA)." },
 { q: "A company’s accounting year ends on 31 December 2026. By when must it file its CIT return?", o: ["Within 30 days of the year-end","By the 21st of the month after the year-end","Within six months of the accounting year-end","Within 12 months of the year-end"], a: 2, e: "A company files within six months of its accounting year-end." },
 { q: "What are an employer’s PAYE deadlines?", o: ["Remit within 10 days after the month-end; annual return by 31 January","Remit by the 21st of the next month; annual return by 31 March","Remit quarterly; annual return within six months","Remit within 30 days; annual return by 30 June"], a: 0, e: "PAYE is remitted within 10 days after month-end; the annual return is due by 31 January." },
 { q: "Within what time must tax assessed be paid after the notice of assessment is served?", o: ["Within 7 days","Within 14 days","Within 90 days","Within 30 days of service of the notice"], a: 3, e: "Payment is due within 30 days of service (s.49 NTAA)." },
 { q: "A company files its return three months late. Under s.101 (₦100,000 first month, ₦50,000 each further month), what is the penalty?", o: ["₦150,000","₦200,000","₦300,000","₦100,000"], a: 1, e: "₦100,000 + (2 × ₦50,000) = ₦200,000." },
 { q: "A company registers four months late. Under s.100 (₦50,000 first month, ₦25,000 each further month), what is the penalty?", o: ["₦100,000","₦200,000","₦125,000","₦150,000"], a: 2, e: "₦50,000 + (3 × ₦25,000) = ₦125,000." },
 { q: "A company fails to deduct ₦2,000,000 of WHT it should have deducted. What is the s.105 penalty?", o: ["₦800,000, in addition to the tax","₦200,000","₦400,000","₦15,000,000"], a: 0, e: "The penalty is 40% of the amount not deducted: 40% × ₦2,000,000 = ₦800,000, plus the tax." },
 { q: "What is the time limit for an additional (back-duty) assessment under s.36 NTAA?", o: ["Three years, with no exceptions","Five years, even for fraud","Six years in every case","Six years, but no time limit where there is deliberate misstatement"], a: 3, e: "Six years, but no limit for deliberate misstatement, fraud or wilful neglect." },
 { q: "When may the authority raise a best-of-judgement (BOJ) assessment under s.35 NTAA?", o: ["Only when the taxpayer has paid his tax early","Where no return is filed or the accounts are unreliable","Only for companies with audited accounts","Only after a court order"], a: 1, e: "BOJ applies where no return is filed, accounts are unreliable, records are not kept, a notice is ignored or the assessment is in jeopardy." },
 { q: "Under s.38 NTAA, a deemed profit assessment allows the authority to:", o: ["Add a fixed penalty of ₦1,000,000 to the tax","Double the previous year’s tax","Assess a fair percentage of gross income or turnover as profit","Treat all receipts as profit with no deductions"], a: 2, e: "Where profit is nil, too low or cannot be ascertained, a fair percentage of gross income or turnover is assessed." }
]},
{ id: 7, name: "Objections and appeals", sub: "30-day rules, Tribunal, Ombud", qs: [
 { q: "What is an advance ruling?", o: ["A refund of tax overpaid in a previous year","A written, binding opinion on how a tax law applies to a proposed transaction","A court order settling a tax dispute","An estimate of next year’s tax payable"], a: 1, e: "An advance ruling (ss.73–76 NTAA) gives certainty before a transaction is concluded." },
 { q: "Which statement about an advance ruling is correct?", o: ["It can never be refused","It remains valid even if the law changes materially","It can be refused where the matter is before a court or tribunal, and it lapses if the law changes materially","It applies to every taxpayer who asks, whatever the facts"], a: 2, e: "A ruling can be refused where the issue is before a court or tribunal, and lapses if the law or facts change materially." },
 { q: "Within what time must a taxpayer file a notice of objection to an assessment?", o: ["30 days from service of the notice of assessment","14 days from the date of the assessment","90 days from service","Six months from the end of the year of assessment"], a: 0, e: "Objection is due within 30 days of service (s.41 NTAA), extendable for good cause." },
 { q: "Which of the following must a valid notice of objection contain?", o: ["Only the taxpayer’s name and Tax ID","A request that all penalties be waived","Payment of the full assessment in advance","The items and amounts disputed, the amendment sought with grounds, and the profit and tax the taxpayer admits"], a: 3, e: "The notice must be specific: items and amounts disputed, amendment sought and grounds, and the admitted profit and tax." },
 { q: "While an objection is pending, what happens to the tax assessed?", o: ["All tax is suspended until the objection is decided","The disputed portion may be held in abeyance, but the undisputed tax must still be paid","The taxpayer must pay the full assessment and later claim a refund","Interest stops running on the whole assessment"], a: 1, e: "Only the disputed portion is held in abeyance; undisputed tax must still be paid (s.86 NTAA)." },
 { q: "After the authority refuses to amend an assessment on objection, the taxpayer’s next step is to:", o: ["Appeal directly to the Supreme Court","Appeal to the Court of Appeal within 7 days","Appeal to the Tax Appeal Tribunal within 30 days","Do nothing, because the assessment is automatically cancelled"], a: 2, e: "The next step is an appeal to the Tax Appeal Tribunal within 30 days." },
 { q: "After a Tax Appeal Tribunal decision, a dissatisfied party’s next right of appeal is to:", o: ["The Federal High Court, on a point of law, within 30 days","The Supreme Court directly","Back to the tax authority for a fresh decision","The Court of Appeal within 90 days, on the facts"], a: 0, e: "Appeal lies on a point of law to the Federal High Court within 30 days, then the Court of Appeal and the Supreme Court." },
 { q: "At the Tax Appeal Tribunal, who bears the burden of proof?", o: ["On the tax authority","Shared equally by both parties","On the Tribunal Chairman","On the appellant (the taxpayer)"], a: 3, e: "The appellant must show that the assessment is incorrect or excessive." },
 { q: "Which orders may the Tax Appeal Tribunal make on an assessment appeal?", o: ["Confirm or annul only","Confirm, reduce, increase or annul the assessment","Reduce the assessment only","Refer the matter to the Tax Ombud"], a: 1, e: "The Tribunal may confirm, reduce, increase or annul the assessment." },
 { q: "Which statement about the Tax Ombud is correct?", o: ["It hears appeals against assessments in place of the Tribunal","It charges a fee based on the tax in dispute","It is an independent, informal, free office that handles complaints about tax authorities but not matters already in court or before a tribunal","It sets tax rates for each State"], a: 2, e: "The Ombud is free and informal, investigates within 14 days, and cannot deal with matters already before a court or tribunal." }
]},
{ id: 8, name: "Tax Clearance Certificate", sub: "Conditions, uses, procedure", qs: [
 { q: "What is a Tax Clearance Certificate (TCC)?", o: ["A receipt for tax paid on a single transaction","A certificate showing the taxpayer’s tax position and confirming that obligations have been met","A licence to carry on business in Nigeria","A refund voucher for overpaid tax"], a: 1, e: "A TCC (s.72 NTAA) shows a taxpayer’s tax position and confirms obligations are met." },
 { q: "Which period does a TCC cover?", o: ["The current year only","The last 12 months","The last six years","The last three years"], a: 3, e: "A TCC covers the last three years." },
 { q: "Which of the following is a condition for granting a TCC?", o: ["A valid Tax ID, returns filed, and tax assessed and paid for the period","A bank statement showing a balance above ₦1,000,000","A letter from a past employer","A CAC certificate only"], a: 0, e: "The taxpayer needs a valid Tax ID, filed returns, and tax assessed and paid for the period." },
 { q: "Which of the following would normally prevent the authority from issuing a TCC?", o: ["The taxpayer has an objection in time","The taxpayer uses an accredited tax agent","The taxpayer has unfiled returns or unpaid assessed tax for the period","The taxpayer has registered a new Tax ID"], a: 2, e: "A taxpayer with unfiled returns or unpaid assessed tax cannot be cleared." },
 { q: "For which of the following is a TCC typically required?", o: ["Buying groceries from a supermarket","Tendering for a government contract","Filing a monthly VAT return","Paying PAYE for staff"], a: 1, e: "A TCC is commonly required for government contracts and tenders, licences, land transactions and business registrations." },
 { q: "What should a taxpayer do first when preparing to apply for a TCC?", o: ["Print the certificate and fill in the details","Pay a gratuity to the tax officer","Wait for the authority to send an invitation","Settle all tax liabilities and file all outstanding returns for the period"], a: 3, e: "Clear the record first: settle liabilities and file all outstanding returns." },
 { q: "How can a taxpayer submit an application for a TCC?", o: ["Online through the authority’s portal, or manually at the tax office","Only by post to the Minister of Finance","Only through a bank branch","Only through a court registry"], a: 0, e: "Apply online through the portal or in person at the tax office." },
 { q: "Which documents should a taxpayer gather before applying for a TCC?", o: ["Only the audited accounts of the largest competitor","A character reference from a community leader","Receipts for tax payments and evidence of returns filed for the period","A copy of the bank’s annual report"], a: 2, e: "The authority verifies the application against payment receipts and evidence of filed returns." },
 { q: "What is the penalty for a forged or false TCC?", o: ["₦100,000 only","₦1,000,000 and possible imprisonment","₦15,000,000 only","No penalty, if the transaction goes ahead"], a: 1, e: "A forged or false TCC attracts ₦1,000,000 and possible imprisonment." },
 { q: "Who issues a TCC?", o: ["The Corporate Affairs Commission","ICAN","The Nigeria Customs Service","The relevant tax authority (NRS for companies, State IRS for resident individuals)"], a: 3, e: "The relevant tax authority issues the TCC: the NRS for companies and the State IRS for resident individuals." }
]},
{ id: 9, name: "Withholding tax", sub: "Rates, exemptions, deadlines", qs: [
 { q: "What is the nature of withholding tax (WHT)?", o: ["An advance payment of income tax deducted at source by the payer","A tax on the profit of the paying company","A tax on goods imported into Nigeria","A penalty for late filing of returns"], a: 0, e: "WHT is an advance payment of income tax deducted at source and remitted to the tax authority. The payee takes a credit against his final liability, except where it is a final tax (for example on dividends to individuals and non-resident passive income)." },
 { q: "In which case is WHT a final tax rather than an advance payment?", o: ["WHT on rent received by a company","WHT on a consultancy fee received by a resident company","WHT on a dividend received by an individual","WHT on a supply of goods to a company"], a: 2, e: "WHT on a dividend received by an individual is final, so the dividend is not assessed again. WHT on rent, consultancy fees and supplies is a credit against the payee’s final liability." },
 { q: "A small company or unincorporated body is exempt from deducting WHT when:", o: ["The supplier has a Tax ID and the monthly transaction does not exceed ₦2,000,000","The transaction is above ₦2,000,000 and the supplier is a company","The payer is a government agency","The supplier is resident in the same State"], a: 0, e: "Under the 2024 Regulations the exemption needs both conditions: the supplier has a Tax ID and the monthly transaction is ₦2,000,000 or less. If either fails, the payer must deduct." },
 { q: "A company pays a consultancy fee of ₦4,000,000 to a resident company. How much WHT must it deduct?", o: ["₦80,000","₦100,000","₦400,000","₦200,000"], a: 3, e: "Consultancy, technical, management and professional fees to a resident company attract 5%. 5% × ₦4,000,000 = ₦200,000, remitted to the NRS because the payee is a company." },
 { q: "A company pays ₦3,000,000 for general services to a resident company that has no Tax ID. The normal rate is 2%. How much WHT must be deducted?", o: ["₦60,000","₦120,000","₦150,000","₦300,000"], a: 1, e: "Where the payee has no Tax ID, the rate is doubled on non-passive payments: 4% × ₦3,000,000 = ₦120,000." },
 { q: "A company pays directors’ fees of ₦500,000 to a resident director. What WHT must be deducted?", o: ["₦50,000","₦25,000","₦75,000","₦100,000"], a: 2, e: "Directors’ fees to a resident individual attract 15% (20% for a non-resident individual). 15% × ₦500,000 = ₦75,000, remitted to the State IRS because the payee is an individual." },
 { q: "Within what time must WHT be remitted to the relevant tax authority?", o: ["21 days for a company payee, 30 days for an individual payee","30 days for a company payee, 21 days for an individual payee","7 days for all payees","By the 21st of the following month for all payees"], a: 0, e: "Remit within 21 days where the payee is a company and 30 days where the payee is an individual, and issue a receipt and the prescribed statement." },
 { q: "Which of the following payments is exempt from deduction of WHT?", o: ["Consultancy fees paid to a resident company","Rent paid to a landlord","Directors’ fees","Goods manufactured by the supplier himself"], a: 3, e: "Regulation 10 exempts, among others, goods manufactured or materials produced by the supplier, insurance premiums, over-the-counter transactions, bank interest and fees on direct debit, and petroleum products. An exemption from deduction is not an exemption from income tax." },
 { q: "What is the penalty for failing to deduct WHT that should have been deducted?", o: ["10% per annum on the unpaid tax","40% of the amount not deducted, plus the tax itself","A fixed fine of ₦50,000","There is no penalty if the payee later pays his tax"], a: 1, e: "Failure to deduct attracts 40% of the amount not deducted (s.105 NTAA), and the payer must still pay the tax. Failure to remit tax already deducted attracts the tax plus 10% per annum and interest at MPR (s.107)." },
 { q: "A company deducts WHT from a payment to an individual resident in Oyo State. To whom is the WHT remitted?", o: ["The NRS, regardless of who the payee is","The Local Government Revenue Committee","The State IRS of the State where the individual is resident","The Joint Revenue Board"], a: 2, e: "Remit to the authority with jurisdiction over the payee: the NRS for company payees, and the State IRS for payees who are individuals resident in the State." }
]},
{ id: 10, name: "Value added tax", sub: "Input VAT, thresholds, sums", qs: [
 { q: "Under the 2026 VAT rules, input VAT is recoverable on which purchases used to make taxable supplies?", o: ["Goods only","Goods and fixed assets, but not services","Goods, services and fixed assets used to make taxable supplies","Nothing, because VAT is a final cost to the business"], a: 2, e: "Nigeria operates a consumption-type VAT. Input VAT on goods, services and fixed assets used for taxable (including zero-rated) supplies is recoverable, claimed within five years and apportioned for mixed use." },
 { q: "Which statement about the VAT compliance threshold is correct?", o: ["Taxable supplies of ₦100m or less and fixed assets of ₦250m or less, except that professionals must always charge","Any business with turnover below ₦50m, including professionals","Only businesses owned by individuals","There is no threshold; all businesses must charge VAT"], a: 0, e: "A small business need not charge or file VAT, but professionals must always charge, and a business that crosses the threshold charges VAT from the following month." },
 { q: "How is input VAT treated when a business makes zero-rated supplies compared with exempt supplies?", o: ["Recoverable for both zero-rated and exempt supplies","Not recoverable for either","Recoverable for exempt supplies only","Recoverable for zero-rated supplies, not recoverable for exempt supplies"], a: 3, e: "Zero-rated supplies are taxable at 0%, so input VAT is recoverable (and a refund may be claimed). Input VAT on the costs of making exempt supplies is not recoverable and becomes a cost." },
 { q: "Standard-rated sales for the month were ₦21,500,000, inclusive of VAT at 7.5%. How much is the output VAT?", o: ["₦1,612,500","₦1,500,000","₦2,150,000","₦1,075,000"], a: 1, e: "Extract VAT from an inclusive price with 7.5/107.5: ₦21,500,000 × 7.5 ÷ 107.5 = ₦1,500,000. Multiplying by 7.5% would give ₦1,612,500 and overstate the VAT." },
 { q: "A company’s output VAT for the month is ₦900,000. Recoverable input VAT is ₦650,000 and there is a credit of ₦100,000 brought forward. How much VAT is payable?", o: ["₦250,000","₦350,000","₦150,000","₦50,000"], a: 2, e: "Net VAT payable = output − recoverable input − credit brought forward = ₦900,000 − ₦650,000 − ₦100,000 = ₦150,000, payable by the 21st of the following month." },
 { q: "When is a VAT return normally due?", o: ["By the 21st of the following month","Within 10 days after the month-end","Within six months of the year-end","By 31 January each year"], a: 0, e: "VAT returns and payment are due by the 21st of the following month (s.22 NTAA). Government agencies that withhold VAT remit by the 14th." },
 { q: "What does the VAT reverse charge mean for services bought from a non-resident supplier?", o: ["The non-resident supplier is exempt from VAT","The service is zero-rated","The Customs Service collects the VAT at the border","The Nigerian customer accounts for the VAT himself"], a: 3, e: "Under the reverse charge (s.150), the Nigerian customer self-accounts for VAT on services bought from a non-resident supplier who has not registered, charging output VAT and claiming input VAT where entitled." },
 { q: "On what base is VAT charged by Customs on imported goods?", o: ["The FOB value only","The CIF value plus import duty, surcharge and the other levies","The CIF value only","The import duty only"], a: 1, e: "Import VAT is 7.5% of CIF + import duty + surcharge + ETLS + CISS. Using CIF alone understates it." },
 { q: "Under the VAT rules, the time of supply is:", o: ["The date the return is filed","The last day of the financial year","The earliest of invoice, delivery or availability, and payment due or received","The date the customer’s goods are sold on"], a: 2, e: "The time of supply is the earliest of the invoice date, delivery or availability, and payment due or received. It fixes the month in which output VAT is accounted for." },
 { q: "What is the VAT sharing formula among the tiers of government?", o: ["Federal 10%, States and FCT 55%, Local Governments 35%","Federal 50%, States 30%, Local Governments 20%","Federal 35%, States 55%, Local Governments 10%","Federal 100%"], a: 0, e: "VAT revenue is shared 10% Federal, 55% States and FCT, 35% Local Governments." }
]},
{ id: 11, name: "Stamp duties", sub: "Rates, exemptions, penalties", qs: [
 { q: "What is stamp duty?", o: ["A tax on the profit earned from a transaction","A tax on instruments (documents) that evidence transactions","A tax on goods crossing the border","A tax on employee salaries"], a: 1, e: "Stamp duty is a tax on instruments, including electronic documents. It is charged on the document, not on profit, and stamping gives the document legal validity and admissibility." },
 { q: "How does ad valorem duty differ from fixed duty?", o: ["Ad valorem duty is a percentage of value; fixed duty is a stated sum regardless of value","Ad valorem duty is a stated sum; fixed duty is a percentage of value","Both are percentages of the taxpayer’s profit","Ad valorem duty applies only to electronic documents"], a: 0, e: "Fixed duty is a stated sum (for example ₦1,000 on an agreement). Ad valorem duty is a percentage of value (for example 1.5% on a conveyance on sale)." },
 { q: "Land is sold for ₦40,000,000 under a conveyance on sale. What is the stamp duty at 1.5%?", o: ["₦300,000","₦400,000","₦600,000","₦750,000"], a: 2, e: "1.5% × ₦40,000,000 = ₦600,000, paid by the transferee. The 0.75% rate belongs to share capital." },
 { q: "A company increases its share capital by ₦100,000,000. What is the stamp duty at 0.75%?", o: ["₦1,500,000","₦375,000","₦125,000","₦750,000"], a: 3, e: "Duty on share capital is 0.75%, paid by the company: 0.75% × ₦100,000,000 = ₦750,000." },
 { q: "A company makes 20 electronic transfers of ₦15,000 each in one day. What total stamp duty applies at ₦50 per qualifying transfer?", o: ["₦500","₦1,000","₦15,000","₦300,000"], a: 1, e: "A transfer of ₦10,000 or more carries a fixed ₦50, paid by the sender. 20 × ₦50 = ₦1,000." },
 { q: "Which of the following is exempt from stamp duty?", o: ["An electronic transfer of ₦9,500","A conveyance on sale of land","An increase in share capital","An electronic transfer of ₦50,000 to a supplier"], a: 0, e: "Electronic transfers below ₦10,000, salary payments and transfers between a person’s own accounts are exempt." },
 { q: "Within what time must an instrument be stamped after execution?", o: ["Within 7 days","Within 21 days","Within six months","Within 30 days of execution"], a: 3, e: "An instrument must be stamped within 30 days of execution (s.125 NTA)." },
 { q: "What is the legal consequence of failing to stamp a dutiable instrument?", o: ["It is void and the transaction is cancelled","It is inadmissible in civil proceedings until duty and penalty are paid","It is admissible in all proceedings without penalty","It is automatically stamped by the bank"], a: 1, e: "An unstamped dutiable instrument is inadmissible in civil proceedings until the duty and any penalty are paid. It remains admissible in criminal proceedings." },
 { q: "What is the penalty under s.110 for failing to stamp an instrument in time?", o: ["40% of the duty not paid","A fixed fine of ₦1,000,000","10% of the unpaid duty plus interest at MPR","No penalty if the duty is paid within one year"], a: 2, e: "The penalty is 10% of the unpaid duty plus interest at the CBN monetary policy rate. Non-disclosure of an instrument carries a separate ₦100,000 penalty (s.111)." },
 { q: "How is ad valorem duty computed where the consideration for an instrument is not money?", o: ["On the market value of the consideration","On the nominal value only","No duty is payable","A fixed duty of ₦50"], a: 0, e: "Where the consideration is not money, duty is computed on its market value." }
]},
{ id: 12, name: "Customs and excise", sub: "CIF, levies, import VAT", qs: [
 { q: "How do customs duty and excise duty differ?", o: ["Customs applies to local goods, excise to imports","Customs is charged on goods crossing the border; excise on specified goods manufactured locally","Both are charged only on exports","Customs is paid by consumers, excise by the Customs Service"], a: 1, e: "Customs duty is a tax on goods imported (and some exported) at the border. Excise duty is a tax on specified goods produced in Nigeria." },
 { q: "How is CIF value calculated?", o: ["FOB + insurance + freight","FOB + import duty + VAT","FOB − freight","Invoice price + surcharge"], a: 0, e: "CIF = cost (FOB) + insurance + freight. Customs duty is applied to the CIF value." },
 { q: "FOB value is ₦8,000,000, insurance ₦80,000 and freight ₦620,000. What is the CIF value?", o: ["₦8,080,000","₦8,620,000","₦8,700,000","₦8,000,000"], a: 2, e: "₦8,000,000 + ₦80,000 + ₦620,000 = ₦8,700,000." },
 { q: "FOB ₦10,000,000, insurance ₦100,000, freight ₦400,000. Import duty is 10% of CIF; surcharge 7% of duty; ETLS 0.5% of CIF; CISS 1% of FOB. What is the total of duty and levies?", o: ["₦1,050,000","₦1,123,500","₦1,223,500","₦1,276,000"], a: 3, e: "CIF = ₦10,500,000. Duty ₦1,050,000 + surcharge ₦73,500 + ETLS ₦52,500 + CISS ₦100,000 = ₦1,276,000." },
 { q: "Using the same figures (CIF ₦10,500,000; duty and levies ₦1,276,000), what is the import VAT at 7.5%?", o: ["₦787,500","₦883,200","₦960,000","₦1,276,000"], a: 1, e: "VAT base = CIF + duty and levies = ₦11,776,000. 7.5% × ₦11,776,000 = ₦883,200. Total payable to Customs = ₦1,276,000 + ₦883,200 = ₦2,159,200." },
 { q: "Which method is the first (primary) method of customs valuation?", o: ["Transaction value","Deductive value","Computed value","Fall-back method"], a: 0, e: "Valuation starts with the transaction value (the price actually paid, adjusted). The other methods apply in turn only when it cannot be used." },
 { q: "What is a post-clearance audit?", o: ["An audit before goods arrive at the port","An audit after goods are cleared, covering the trader’s records, accounts and declarations","A court hearing on a customs offence","A tax audit of the importer’s income tax return only"], a: 1, e: "The Service may audit a trader after goods are cleared, at its offices or the trader’s premises, with written notice. The trader must produce records and cooperate." },
 { q: "When does excise duty on locally manufactured goods arise?", o: ["When raw materials are purchased","When goods are sold to the final consumer","When goods are removed from the production premises","When the company files its CIT return"], a: 2, e: "For local production the dutiable event is removal of the excisable goods from the production premises." },
 { q: "What happens if a manufacturer pays excise duty late?", o: ["Nothing, if paid within a year","A 40% penalty of the duty","A flat ₦50,000 fine","A 10% monthly penalty on the unpaid duty"], a: 3, e: "Excise is payable within the first 21 working days of the next month, with a 10% monthly penalty for lateness. (Confirm this penalty detail in the Study Text chapter.)" },
 { q: "Which levy is computed on the FOB value rather than the CIF value?", o: ["ETLS levy","Surcharge on import duty","CISS (Comprehensive Import Supervision Scheme) levy","VAT"], a: 2, e: "CISS is 1% of FOB. ETLS is 0.5% of CIF, the surcharge is 7% of the import duty, and VAT is 7.5% of CIF plus duty and levies." }
]},
{ id: 13, name: "Fossil-fuel surcharge", sub: "Base, exemptions, returns", qs: [
 { q: "On what base is the fossil-fuel surcharge charged?", o: ["The cost of crude oil to the refinery","The profit of the fuel supplier","The retail price of the chargeable fossil-fuel product","The weight of fuel supplied"], a: 2, e: "The surcharge (ss.159–161 NTA) is charged on the retail price of the chargeable fossil-fuel product." },
 { q: "When does the charge to the surcharge arise on a transaction?", o: ["On the earliest of supply, sale or payment","Only when the fuel is consumed","On the date the return is filed","At the end of the financial year"], a: 0, e: "The chargeable transaction is the supply, sale or payment of the product, whichever happens first." },
 { q: "Which body administers the fossil-fuel surcharge?", o: ["The Nigeria Customs Service","The Nigeria Revenue Service","The State Internal Revenue Service","The Joint Revenue Board"], a: 1, e: "The NRS administers the surcharge under s.24 NTAA. Suppliers register, charge it and remit it with their returns." },
 { q: "Which of the following is exempt from the surcharge?", o: ["All fuels sold to companies","Petrol sold to motorists","Only products sold outside Nigeria","Clean and renewable energy, household kerosene, cooking gas and CNG"], a: 3, e: "Clean and renewable energy, household kerosene, cooking gas (LPG) and compressed natural gas (CNG) are exempt." },
 { q: "Which provisions of the Nigeria Tax Act impose the surcharge on fossil-fuel products?", o: ["Sections 159 to 161","Sections 9 and 10","Sections 100 to 102","Section 56"], a: 0, e: "The surcharge is imposed by ss.159–161 NTA." },
 { q: "By when must a surcharge return be filed and the surcharge paid?", o: ["Within 10 days after the month-end","Within six months of the year-end","By the 21st of the following month","By 31 January each year"], a: 2, e: "Surcharge returns and payment are due by the 21st of the following month (s.24 NTAA)." },
 { q: "What is the penalty for unpaid surcharge?", o: ["No penalty if paid within 12 months","10% plus interest at the CBN monetary policy rate","40% of the surcharge","A fixed ₦10,000 fine"], a: 1, e: "Unpaid surcharge attracts a 10% penalty plus interest at MPR. False returns and failure to register or file attract the general NTAA penalties." },
 { q: "How is the date from which the surcharge applies decided?", o: ["It applies from 1 January 2026 automatically","By the Governor of each State","By a court order","By the Minister’s Order, which sets the effective date"], a: 3, e: "The start of the surcharge is set by the Minister’s Order." },
 { q: "A supplier makes sales of a chargeable product with a retail price of ₦2,000,000. Using an illustrative rate of 5%, how much surcharge is due?", o: ["₦100,000","₦10,000","₦50,000","₦2,100,000"], a: 0, e: "Surcharge = retail price × rate = ₦2,000,000 × 5% = ₦100,000. The exam gives the rate; the base is always the retail price." },
 { q: "Who must register for, charge and remit the surcharge?", o: ["The final consumer of the fuel","The Customs Service on behalf of consumers","Suppliers of the chargeable products","Only State governments"], a: 2, e: "Suppliers of chargeable products register, charge the surcharge on their sales, and remit it with their returns." }
]},
{ id: 14, name: "Employment income", sub: "Benefits, residence, PAYE", qs: [
 { q: "Which feature points to a contract of service (employment) rather than a contract for service?", o: ["The worker invoices clients and uses his own methods and tools","The employer controls how, when and where the work is done and bears the risk","The worker is paid per job and may work for many clients","The worker charges VAT on his fees"], a: 1, e: "In a contract of service the employer directs how the work is done, supplies the tools and bears the risk, and PAYE applies. A contract for service is an independent contractor relationship." },
 { q: "A consultant invoices several clients and decides how he works. How is he taxed?", o: ["As a self-employed person, and he may charge VAT and suffer WHT","Under PAYE, like an employee","He is exempt from income tax","Only the clients pay tax on his earnings"], a: 0, e: "A contract for service is self-employment. The consultant is taxed on his business profit, may need to register for VAT, and may have WHT deducted from his fees as an advance payment." },
 { q: "What is Nigerian employment for tax purposes?", o: ["Employment with any company incorporated abroad","Employment where the employee holds a Nigerian passport","Employment whose duties are performed wholly or partly in Nigeria","Employment paid in Naira only"], a: 2, e: "Employment is Nigerian where its duties are performed wholly or partly in Nigeria (or are connected to a Nigerian resident employer). Nationality and the currency of payment do not decide it." },
 { q: "Which authority normally taxes the employment income of a resident individual employee in the private sector?", o: ["The Nigeria Customs Service","The Nigeria Revenue Service","The Joint Revenue Board","The State Internal Revenue Service of his State of residence"], a: 3, e: "The State IRS taxes resident individuals through PAYE and direct assessment. The NRS covers companies, non-residents, the armed forces, police and external affairs staff." },
 { q: "An employer provides a company car that cost ₦6,000,000. What is the annual benefit-in-kind?", o: ["₦300,000","₦600,000","₦120,000","₦1,200,000"], a: 0, e: "The car benefit is 5% of the cost of the car per year: 5% × ₦6,000,000 = ₦300,000." },
 { q: "An employee’s salary is ₦8,000,000 and he has a car benefit of ₦1,000,000. His employer gives him a flat with an annual rental value of ₦2,400,000. What is the accommodation benefit?", o: ["₦2,400,000","₦1,600,000","₦1,800,000","₦2,000,000"], a: 2, e: "The benefit is the lower of the rental value (₦2,400,000) and 20% of gross income. Gross income here is ₦8,000,000 + ₦1,000,000 = ₦9,000,000, and 20% of that is ₦1,800,000." },
 { q: "An employee receives ₦65,000,000 as compensation for loss of employment. How much is taxable?", o: ["Nothing, because all compensation is exempt","₦15,000,000","₦65,000,000","₦50,000,000"], a: 1, e: "The first ₦50,000,000 of compensation for loss of employment or injury is exempt. The excess, ₦15,000,000, is taxable, and the payer must deduct and remit the tax when paying." },
 { q: "Which of the following is exempt from income tax?", o: ["Bonuses paid to senior managers","Directors’ fees paid to a resident individual","Transport allowances","Income of national minimum wage earners"], a: 3, e: "National minimum wage earners (and those earning below it) are exempt from income tax under s.58. Bonuses, directors’ fees and allowances are taxable employment income." },
 { q: "What are an employer’s PAYE deadlines?", o: ["Remit within 10 days after the month-end; annual return by 31 January","Remit by the 21st of the next month; annual return by 31 March","Remit quarterly; annual return within six months","Remit within 30 days; annual return by 30 June"], a: 0, e: "PAYE is deducted monthly and remitted within 10 days after the month-end. The employer’s annual return is due by 31 January (s.14 NTAA)." },
 { q: "For personal income tax, an individual is generally resident in a State if:", o: ["He was born there","He holds a voter’s card there","He has his place or principal place of residence there on 1 January of the year of assessment","He works there for more than one day"], a: 2, e: "Residence is tested by the individual’s place or principal place of residence on 1 January of the year (or on the day he starts a Nigerian employment). A resident is taxed on worldwide employment income; the JRB resolves residency disputes between tax authorities." }
]},
{ id: 15, name: "Computing personal income tax", sub: "Bands, deductions, rent relief", qs: [
 { q: "Under the 2026 rules, which relief has replaced the old consolidated relief allowance (CRA)?", o: ["A higher first band only","Nothing: there is no CRA, and tax is computed after eligible deductions, including rent relief","A flat 20% relief on all income","A dependants’ allowance for each child"], a: 1, e: "The CRA no longer exists. Chargeable income is gross income less exempt items and eligible deductions (pension, NHF, NHIS, life assurance, owner-occupied loan interest, and rent relief). The first ₦800,000 is taxed at 0%." },
 { q: "An employee paid rent of ₦4,000,000 for his own rented flat. What rent relief can he claim?", o: ["₦800,000","₦4,000,000","₦500,000","₦200,000"], a: 2, e: "Rent relief is the lower of 20% of the rent paid and ₦500,000. 20% × ₦4,000,000 = ₦800,000, but the cap is ₦500,000, so he claims ₦500,000." },
 { q: "An individual has chargeable income of ₦2,000,000. What is the income tax?", o: ["₦180,000","₦300,000","₦330,000","₦120,000"], a: 0, e: "First ₦800,000 at 0% = nil. Next ₦1,200,000 at 15% = ₦180,000. Total tax = ₦180,000." },
 { q: "An individual has chargeable income of ₦5,000,000. What is the income tax?", o: ["₦750,000","₦900,000","₦330,000","₦690,000"], a: 3, e: "First ₦800,000 at 0% = nil; next ₦2,200,000 at 15% = ₦330,000; the remaining ₦2,000,000 at 18% = ₦360,000. Total = ₦690,000." },
 { q: "An individual has chargeable income of ₦12,000,000. What is the income tax?", o: ["₦1,950,000","₦2,160,000","₦1,620,000","₦3,000,000"], a: 0, e: "₦0 on the first ₦800,000; ₦330,000 on the next ₦2,200,000; and 18% × ₦9,000,000 = ₦1,620,000 on the next band. Total = ₦1,950,000, which is the tax at the top of the 18% band." },
 { q: "Which of the following is NOT an eligible deduction in computing chargeable income?", o: ["Pension contributions under the Pension Reform Act","Contributions to the National Housing Fund","Life assurance premium for self or spouse","School fees and upkeep of children"], a: 3, e: "Eligible deductions are pension, NHF, NHIS, owner-occupied house loan interest, life assurance premium for self or spouse, and rent relief. There is no relief for children’s school fees or upkeep." },
 { q: "Gross income is ₦12,000,000. The employee paid pension ₦768,000, NHF ₦240,000, NHIS ₦120,000 and a life assurance premium of ₦150,000. What is his chargeable income?", o: ["₦11,232,000","₦11,880,000","₦10,722,000","₦12,000,000"], a: 2, e: "Eligible deductions total ₦768,000 + ₦240,000 + ₦120,000 + ₦150,000 = ₦1,278,000. Chargeable income = ₦12,000,000 − ₦1,278,000 = ₦10,722,000." },
 { q: "Which of the following gains is not chargeable to income tax for an individual?", o: ["A gain on the sale of a rental property","A gain on the sale of commercial land","A gain on the sale of his principal private residence (one in a lifetime, up to one acre)","A gain on the sale of a business asset"], a: 2, e: "Non-chargeable gains include one principal private residence in a lifetime (with up to one acre), compensation up to ₦50m, personal chattels up to ₦5m or 3 × the minimum wage (whichever is higher), up to two private motor vehicles, and gifts." },
 { q: "What may the tax authority do about deductions and reliefs an individual claims?", o: ["Accept every claim without evidence","Require evidence for each claim and disallow claims that are not proved","Allow claims only if made by an accountant","Allow claims for the current year only"], a: 1, e: "Under s.32 the authority may require proof of each deduction or relief (pension and NHF statements, receipts, loan statements, tenancy agreement and rent receipts). Unproven claims may be disallowed, and false claims attract penalties." },
 { q: "What is the basis of assessment for an individual’s employment income and for his business profits?", o: ["Both on the preceding-year basis","Both on the actual-year basis","Employment income on the preceding-year basis; business profits on the actual-year basis","Employment income on the actual (current) year; business profits on the preceding-year basis"], a: 3, e: "Employment income is taxed on the actual (current) year. Business profits and investment income are taxed on the preceding-year basis, with special rules at commencement, change of date and cessation." }
]},
{ id: 16, name: "Settlements, trusts and estates", sub: "Settlor, trustee, beneficiaries", qs: [
 { q: "Who is the settlor of a settlement or trust?", o: ["The person who creates it or provides the property","The person who manages the property","The person who receives the income","The tax authority"], a: 0, e: "The settlor creates the settlement or provides the property. The trustee manages it and the beneficiaries receive the benefit." },
 { q: "Who manages the property of a deceased person until it is distributed?", o: ["The settlor","The annuitant","The personal representative (executor or administrator)","The Tax Appeal Tribunal"], a: 2, e: "An estate is the property of a deceased person, managed by the executor or administrator (the personal representative)." },
 { q: "What is an annuitant?", o: ["A person who creates a trust","A person who receives a fixed annual sum out of the income of a trust or estate","A person who audits a trust","A trustee who is also a beneficiary"], a: 1, e: "An annuitant is entitled to a fixed annual sum paid out of the income. The annuity is allowable against the trust income and taxable on the annuitant." },
 { q: "Which authority administers tax on individuals, estates, trusts and settlements?", o: ["The Nigeria Customs Service","The Joint Revenue Board","The Local Government Revenue Committee","The State Internal Revenue Service"], a: 3, e: "The State IRS assesses and collects tax from individuals, estates, trusts and settlements within the State. The NRS covers non-resident trustees." },
 { q: "What is the basis period for the income of a trustee, executor or beneficiary?", o: ["The preceding year","The current year only","The calendar year of the settlor’s death","Any year the trustee chooses"], a: 0, e: "Income of trustees, executors, beneficiaries and annuitants is assessed on the preceding-year basis." },
 { q: "Which of the following is allowable against the income of a trust or estate?", o: ["The personal expenses of a beneficiary","Trustee or executor expenses connected with the trust or estate, and fixed annuities paid out of income","Capital distributions to beneficiaries","The trustee’s private holidays"], a: 1, e: "Allowable items are administration expenses and remuneration of the trustee or executor, capital allowances, and fixed annuities paid out of the income. Personal expenses and capital distributions are not allowable." },
 { q: "A trust earns ₦4,000,000, incurs trustee expenses of ₦200,000 and pays a fixed annuity of ₦300,000. How much is available for the beneficiaries?", o: ["₦4,000,000","₦3,800,000","₦3,500,000","₦3,200,000"], a: 2, e: "₦4,000,000 − ₦200,000 − ₦300,000 = ₦3,500,000 available to the beneficiaries." },
 { q: "Using the same trust, beneficiary A is entitled to 60% of the ₦3,500,000 and has no other income. What is his tax?", o: ["₦315,000","₦195,000","₦210,000","₦0"], a: 1, e: "60% × ₦3,500,000 = ₦2,100,000. First ₦800,000 at 0%; the next ₦1,300,000 at 15% = ₦195,000." },
 { q: "When is the settlor himself taxed on income of a settlement?", o: ["Never, once the property has been transferred","Only when the trust is registered abroad","Whenever the trustee is a company","Where he keeps the power to revoke it, or it benefits him, his spouse or his minor child"], a: 3, e: "The settlor is taxed on the income where the settlement is revocable or he retains control or benefit, or it is paid to his spouse or minor child, to stop income being shifted to avoid tax." },
 { q: "A trustee wants to make a discretionary payment to a beneficiary. When is this permitted?", o: ["Only where the trust deed gives the trustee that power","Whenever the beneficiary asks for it","Only with the tax authority’s approval of each payment","Whenever the trustee is a lawyer"], a: 0, e: "A discretionary payment is possible only where the trust deed gives the trustee that power. Otherwise income follows the fixed shares in the deed." }
]},
{ id: 17, name: "Sole proprietorship", sub: "Adjusted profit, allowances, tax", qs: [
 { q: "Which of the following is a badge of trade?", o: ["Frequency of similar transactions","The colour of the goods","The owner’s age","The location of the bank"], a: 0, e: "Badges of trade include subject matter, frequency of transactions, length of ownership, supplementary work, organisation, and profit motive. They help decide whether an activity is a trade." },
 { q: "Which of the following is NOT deductible in computing a sole trader’s assessable profit?", o: ["Wages paid to staff","Rent of the shop","His own salary and drawings","Repairs to the shop"], a: 2, e: "A sole trader cannot deduct his own salary, drawings, private expenses, interest on his own capital, depreciation or capital items." },
 { q: "Net profit is ₦7,500,000 after charging depreciation ₦1,200,000, a political donation ₦100,000 and private expenses ₦180,000. What is the adjusted profit?", o: ["₦6,020,000","₦8,880,000","₦8,980,000","₦7,500,000"], a: 2, e: "Add back depreciation, the donation and private expenses: ₦7,500,000 + ₦1,200,000 + ₦100,000 + ₦180,000 = ₦8,980,000." },
 { q: "Equipment (Class 2, 20%) costing ₦5,000,000 is in use for the full year. What is the capital allowance?", o: ["₦2,500,000","₦500,000","₦1,250,000","₦1,000,000"], a: 3, e: "Allowance is straight line on cost: 20% × ₦5,000,000 = ₦1,000,000. There is no initial allowance." },
 { q: "A delivery van (Class 3, 25%) costing ₦4,000,000 is in use for the full year. What is the capital allowance?", o: ["₦1,000,000","₦2,000,000","₦800,000","₦500,000"], a: 0, e: "25% × ₦4,000,000 = ₦1,000,000." },
 { q: "Adjusted profit is ₦8,980,000. Capital allowances are ₦2,000,000 and a loss brought forward is ₦500,000. What is the total income from the trade?", o: ["₦6,480,000","₦6,980,000","₦8,480,000","₦5,980,000"], a: 0, e: "₦8,980,000 − ₦2,000,000 − ₦500,000 = ₦6,480,000." },
 { q: "After eligible deductions of ₦250,000, the sole trader’s chargeable income is ₦6,230,000. What is his income tax?", o: ["₦1,121,400","₦911,400","₦581,400","₦330,000"], a: 1, e: "₦0 on the first ₦800,000; ₦330,000 on the next ₦2,200,000; and 18% × ₦3,230,000 = ₦581,400. Total = ₦911,400." },
 { q: "Who claims capital allowances on an asset bought under hire purchase or finance lease?", o: ["The lessor","The hirer or lessee, on instalments paid excluding interest","Nobody until the final instalment","The bank that financed it"], a: 1, e: "The hirer or lessee is treated as the owner and claims allowance on instalments paid (excluding interest). The lessor claims nothing." },
 { q: "Who claims capital allowances under an operating lease?", o: ["The lessee","The Tax Appeal Tribunal","The lessor, who keeps ownership","The lessee’s bank"], a: 2, e: "Under an operating lease the lessor keeps ownership and claims the allowance. The lessee deducts the rental as a revenue expense." },
 { q: "How is a trading loss normally relieved?", o: ["It is carried back three years","It is lost if not used in the year it arises","It is paid out as a refund","It is carried forward against profits of the same trade until fully used"], a: 3, e: "Under s.27(6) a trading loss is carried forward against profits of the same trade without time limit. Individuals may also claim current-year relief against other income on a written claim (s.28(3))." }
]},
{ id: 18, name: "Partnerships", sub: "Sharing, salaries, partners’ tax", qs: [
 { q: "What is a partnership for tax purposes?", o: ["A company registered with CAC","Persons carrying on business in common with a view to profit, each taxed individually","Any two employees of the same company","A trust with several beneficiaries"], a: 1, e: "A partnership is persons carrying on business in common with a view to profit. It is not itself a taxable person; each partner is taxed on his share." },
 { q: "If there is no partnership deed, how are profits shared?", o: ["In the ratio of capital","All to the senior partner","Equally, with no salary or interest","By the tax authority’s choice"], a: 2, e: "Without a deed, capital, profits and losses are shared equally and no salary or interest is allowed. The deed should be registered with the tax authority." },
 { q: "In computing partnership profit, partners’ salaries and interest on capital are:", o: ["Not deductible","Deductible, then added to each partner’s income","Taxed in the partnership instead of the partners","Deductible only for companies"], a: 1, e: "Unlike a sole trader, a partnership deducts partners’ salaries and interest on capital, and each partner is then taxed on his salary, interest and share of the balance." },
 { q: "Profit before partners’ remuneration is ₦12,000,000. A’s salary is ₦1,000,000 and interest on capital is A ₦300,000 and B ₦200,000. What profit is shared?", o: ["₦12,000,000","₦11,000,000","₦10,500,000","₦10,000,000"], a: 2, e: "₦12,000,000 − ₦1,000,000 − ₦500,000 = ₦10,500,000 is shared in the profit ratio." },
 { q: "If profits are shared 60:40, what is A’s share of the ₦10,500,000?", o: ["₦6,300,000","₦4,200,000","₦7,000,000","₦5,250,000"], a: 0, e: "60% × ₦10,500,000 = ₦6,300,000, and B gets 40% = ₦4,200,000." },
 { q: "What is A’s gross income from the partnership (salary + interest + share)?", o: ["₦6,300,000","₦6,600,000","₦7,300,000","₦7,600,000"], a: 3, e: "₦1,000,000 + ₦300,000 + ₦6,300,000 = ₦7,600,000." },
 { q: "Capital allowances for the partnership are ₦1,500,000. How are they treated?", o: ["All given to the senior partner","Apportioned in the profit-sharing ratio and deducted per partner","Ignored","Deducted before salaries"], a: 1, e: "Capital allowances are shared in the profit-sharing ratio: A gets 60% (₦900,000) and B 40% (₦600,000), each deducted from his own income." },
 { q: "A’s chargeable income is ₦6,400,000. What is his income tax?", o: ["₦942,000","₦1,152,000","₦330,000","₦612,000"], a: 0, e: "₦330,000 on the first ₦3,000,000 plus 18% × ₦3,400,000 = ₦612,000. Total = ₦942,000." },
 { q: "B’s chargeable income is ₦3,800,000. What is his income tax?", o: ["₦684,000","₦144,000","₦474,000","₦330,000"], a: 2, e: "₦330,000 on the first ₦3,000,000 plus 18% × ₦800,000 = ₦144,000. Total = ₦474,000." },
 { q: "A company is a partner and receives a share of partnership profit. How is that share taxed?", o: ["Under the PIT bands","Under the companies income tax rules","It is exempt","At a flat 10%"], a: 1, e: "A company partner’s share is part of its income and is taxed under the CIT rules (30%, or the small-company rate). Individual partners are taxed under the PIT bands." }
]},
{ id: 19, name: "Investment income", sub: "Dividends, interest, rent, royalty", qs: [
 { q: "Which of the following is investment income?", o: ["Salary","Dividends, interest, rent and royalties","Trading profit","Compensation for loss of office"], a: 1, e: "Investment income is mainly passive income from capital: dividends, interest, rent and royalties." },
 { q: "WHT on a dividend received by an individual is:", o: ["5% and creditable","20% and refundable","10% and a final tax","Not charged"], a: 2, e: "Dividends suffer 10% WHT, which is final for individuals and non-residents." },
 { q: "What is franked investment income?", o: ["A dividend received by a company from another Nigerian company out of profits already taxed","Interest on government bonds","Rent from a company’s own building","Royalty from a foreign licence"], a: 0, e: "FII is a dividend received by a company from another Nigerian company out of taxed profits. It is not taxed again and is deducted from profit in the recipient’s computation." },
 { q: "What is the basis of assessment of dividends, interest, rent and royalty?", o: ["The current year","The year of receipt, always","The next year","The preceding year"], a: 3, e: "Investment income is assessed on the preceding-year basis." },
 { q: "Rent is received in advance. When is it taxed?", o: ["In the year it is received","Only in the year it relates to","Never","When the tenant leaves"], a: 0, e: "Rent received in advance is taxed in the year it is received." },
 { q: "Which of the following is NOT an allowable deduction against rental income?", o: ["Tenement rate","Repairs","Agent’s collection fees","Depreciation of the building"], a: 3, e: "Tenement rates, repairs, collection costs, advertising for tenants, bad debts and interest on loans to acquire or improve the property are allowable. Depreciation is never deductible." },
 { q: "Gross rent is ₦6,000,000. Agent’s fee ₦300,000, repairs ₦400,000, tenement rate ₦100,000 and loan interest ₦500,000. What is the net rental income?", o: ["₦4,700,000","₦5,700,000","₦4,200,000","₦5,100,000"], a: 0, e: "Deductions total ₦1,300,000. ₦6,000,000 − ₦1,300,000 = ₦4,700,000." },
 { q: "Net rental income is ₦4,700,000 with no other income. Tax is ₦636,000 and ₦600,000 WHT was suffered. What is payable?", o: ["₦636,000","₦36,000","₦0, because WHT is final","₦600,000"], a: 1, e: "WHT on rent (10%) is an advance payment, not a final tax. ₦636,000 − ₦600,000 = ₦36,000 is the balance payable." },
